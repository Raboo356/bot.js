name: Minecraft AFK Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar Mineflayer
      run: npm install mineflayer

    - name: Ejecutar Bot de Minecraft
      run: node bot.js
